<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marriage Certificate - E-Governance Portal</title>
<link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg">
<link rel="stylesheet" href="style.css">
</head>
<body class="form-page-body">
<header>
  <div class="logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg">
    <h2>Smart E-Governance Portal</h2>
  </div>
  <nav>
    <a href="index.html">Home</a>
    <a href="index.html#servicesPanel">Services</a>
    <a href="track.html">Track Application</a>
    <a href="admin-login.html">Admin</a>
  </nav>
</header>
<div class="form-wrapper">
  <div class="form-card">
    <div class="form-card-header">
      <span class="form-card-icon"></span>
      <h2>Marriage Certificate</h2>
      <p class="subtitle">Register your marriage and get an official certificate</p>
    </div>
    <form onsubmit="handleSubmit(event)">
      <div class="form-group"><label>Applicant Name</label><input type="text" id="name" placeholder="Your full name" required></div>
      <div class="form-group"><label>Application Date</label><input type="text" id="appDate" readonly></div>
      <div class="form-group"><label>Spouse Name</label><input type="text" id="spouse" placeholder="Spouse full name"></div>
      <div class="form-group"><label>Date of Marriage</label><input type="date" id="marriageDate"></div>
      <div class="form-group"><label>Place of Marriage</label><input type="text" id="place" placeholder="City / Temple / Court"></div>
      <div class="form-group">
        <label>Upload Document (optional)</label>
        <input type="file" id="userFile" accept=".pdf,.jpg,.jpeg,.png">
      </div>
      <button type="submit" id="submitBtn" class="btn-submit">Submit Application</button>
      <button type="button" class="btn-back" onclick="location.href='index.html#servicesPanel'">Back to Services</button>
      <p id="msg"></p>
    </form>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="form-submit.js"></script>
<script>document.getElementById("appDate").value=new Date().toLocaleDateString();function handleSubmit(e){e.preventDefault();submitToFirebase({service:"Marriage Certificate",name:document.getElementById("name").value,dob:document.getElementById("appDate").value,spouse:document.getElementById("spouse").value,marriageDate:document.getElementById("marriageDate").value,place:document.getElementById("place").value});}</script>
</body>
</html>
